[project]
name = "postgres-pk-benchmark"
version = "0.1.0"
description = "PostgreSQL Query Performance Benchmark & RCA: id (PK) vs pk_clone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[project.scripts]
benchmark = "pg_pk_benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_pk_benchmark"]
